name: Update Social Media Feed

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch latest posts
        run: python scripts/fetch_social_posts.py
        env:
          # LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
          # INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          # FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          DEBUG: "false"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/social-posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update social media feed [skip ci]" && git push)
